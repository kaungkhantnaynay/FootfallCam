[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footfallcam-staff-assessment"
version = "0.1.0"
description = "Local visual-tag staff identification with auditable frame-level outputs"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python", "scipy", "scikit-learn", "ultralytics", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pypdf", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
